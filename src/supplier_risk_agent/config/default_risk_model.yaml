# ---------------------------------------------------------------------------
# Default risk model — an EXAMPLE TEMPLATE, not a recommendation.
#
# Every criterion, weight, threshold and action below is illustrative.
# Copy this file, adapt it to your own category strategy and calibrate it
# against your supplier base before using results for real decisions.
#
# This is the RISK VIEW. Criteria (meaning and data source) are defined once in
# criteria.yaml and shared with other views; this file only selects them and
# sets dimensions, weights, classes, rules, actions and calibration settings.
#
# Conventions
#   * Every factor is rated on an ordinal scale 1..5 (1 = low risk, 5 = high risk).
#   * The weights below are DEFAULT weights. Factor weights are relative within
#     their dimension; dimension weights are relative across the model. They are
#     turned into one WeightSet of effective factor weights (summing to 1), which
#     can be overridden per material group or replaced by calibrated weights.
#   * The weighted rating is min-max normalised to 0..100:
#         score = (rating - 1) / (5 - 1) * 100
#     so a supplier rated "1" everywhere scores 0 and "5" everywhere scores 100.
# ---------------------------------------------------------------------------

name: generic-supplier-risk-template
version: "0.1.0"

view: risk
view_label: Risk
view_question: How exposed are we if this supplier fails?
score_label: Risk score
score_orientation: higher_is_riskier   # 0 = lowest risk, 100 = highest risk
label_column: expert_risk_score        # holistic expert label for calibration (0..100, same orientation)

rating_scale:
  min: 1
  max: 5

dimensions:
  - key: severity
    label: Severity Index
    description: >
      How badly a disruption at this supplier would hurt. Composite of how
      replaceable the supplier is and how critical the supplied scope is.
    weight: 0.35
    factors:
      - key: availability
        weight: 0.30
      - key: switching_complexity
        weight: 0.30
      - key: business_impact
        weight: 0.40

  - key: financial
    label: Financial Stability
    description: Likelihood of financial distress or insolvency.
    weight: 0.20
    factors:
      - key: credit_risk
        weight: 0.70
      - key: insolvency_signals
        weight: 0.30

  - key: supply_chain
    label: Supply Chain Risk
    description: Structural vulnerability of the supply route.
    weight: 0.25
    factors:
      - key: country_risk
        weight: 0.40
      - key: sourcing_strategy
        weight: 0.35
      - key: transport_dependency
        weight: 0.25

  - key: esg_compliance
    label: ESG & Compliance
    description: Environmental, social, governance and regulatory compliance exposure.
    weight: 0.20
    factors:
      - key: esg_rating
        weight: 0.60
      - key: compliance_status
        weight: 0.40

# Optional default weights per material group (not one-size-fits-all).
# Values are EFFECTIVE factor weights (share of the overall score). Factors not
# listed keep their global default; the result is re-normalised to sum to 1.
material_group_weights: {}
#  electronics:
#    country_risk: 0.15
#    transport_dependency: 0.10
#  packaging:
#    business_impact: 0.08

# Lower bound (inclusive) of the normalised score for each class, ascending.
risk_classes:
  - key: low
    label: Low
    min_score: 0
  - key: medium
    label: Medium
    min_score: 30
  - key: high
    label: High
    min_score: 50
  - key: critical
    label: Critical
    min_score: 70

# Hard rules that can only raise the class, never lower it. They make sure a
# single severe finding is not averaged away by good scores elsewhere.
escalation_rules:
  - factor: compliance_status
    min_rating: 5
    floor_class: high
    reason: Severe compliance finding — weighted average must not hide it.
  - factor: insolvency_signals
    min_rating: 5
    floor_class: critical
    reason: Acute insolvency signals.

# Below this share of available (weighted) factor data the result is flagged
# for human review instead of being treated as final.
min_data_completeness: 0.75

# Generic action framework per risk class.
actions:
  low:
    review_cycle: annual
    actions:
      - Keep in standard annual supplier evaluation.
  medium:
    review_cycle: semi-annual
    actions:
      - Monitor key indicators between reviews.
      - Discuss identified weak points in the next supplier meeting.
  high:
    review_cycle: quarterly
    actions:
      - Agree a documented risk mitigation plan with the supplier.
      - Assess alternative sources or a dual-sourcing strategy.
      - Review safety stock for affected items.
  critical:
    review_cycle: monthly
    actions:
      - Escalate to category and supply chain management.
      - Start immediate mitigation (alternative source qualification, buffer stock).
      - Define contingency plan and owner with a due date.

# Targeted recommendations when a single dimension is elevated, independent
# of the overall class.
dimension_triggers:
  - dimension: financial
    min_score: 60
    action: Increase financial monitoring frequency and review payment terms and exposure.
  - dimension: supply_chain
    min_score: 60
    action: Evaluate regional or second-source alternatives and transport fallbacks.
  - dimension: esg_compliance
    min_score: 60
    action: Request corrective action plan and schedule an ESG / compliance audit.
  - dimension: severity
    min_score: 60
    action: Reduce dependency (alternative qualification, design-to-multi-source).

# Calibration of weights against subjective expert labels (0..100 risk score
# given by category managers). Disabled by default; enable here or per run.
calibration:
  enabled: false
  method: constrained_least_squares
  min_labels: 8            # labelled suppliers with complete data required
  regularization: 0.05     # ridge pull towards the prior weights (avoids overfitting) ...
  lambda_selection: scaled # ... scaled as 0.05 x 32 / n: constant prior strength, fades as labels accumulate
  lambda_reference_n: 32   # (fixed = use 0.05 as is; cv = choose by cross-validation, tested, not default)
  min_factor_weight: 0.02  # every criterion keeps a minimum influence
  min_improvement: 0.05    # accept only if MSE drops by at least 5 %
  acceptance: cross_validated  # test the improvement out of sample (in_sample = legacy, accepts overfits)
  cv_folds: 5
  cv_repeats: 3
  cv_min_z: 2.0            # ... and the per-supplier improvement must be >= 2 standard errors (chosen in study E5)
  level_bias_threshold: 5.0   # flag if labels differ from scores by >= 5 points on average ...
  level_bias_min_t: 2.0       # ... and by >= 2 standard errors
  level_bias_action: review   # review = never auto-apply such weights; warn = report only
  # fit diagnostics (hints only, see docs/calibration.md)
  residual_share_warning: 0.4       # unexplained share of label variance after calibration
  knockout_severe_rating: 4         # a rating >= 4 counts as a severe finding ...
  knockout_min_suppliers: 3         # ... if at least 3 suppliers have one ...
  knockout_residual_threshold: 5.0  # ... and experts judge them >= 5 points riskier than the model
  auto_apply: true         # re-score with accepted weights (false = propose only)
