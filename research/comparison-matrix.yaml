# Single source of truth for the approach comparison.
#
# Everything derived from these ratings is generated from this file:
#   research/comparison-matrix.md    (tables + rationale)
#   docs/images/spider-diagram.png   (radar chart, README + paper Fig. 1)
#
#   python scripts/generate_spider.py            # regenerate both
#   python scripts/generate_spider.py --check    # fail if the Markdown is out of date (used in tests)
#
# Edit ratings HERE only. Ratings are a reasoned, illustrative assessment, not a measurement.
# All ratings are the qualitative judgement of a single rater (the author), who also built the
# Lean Agentic demonstrator; they have not been independently re-rated.
#
# Rating format per approach:
#   value:       1..5 (1 weak / absent, 2 rudimentary, 3 adequate, 4 strong, 5 very strong); a half point
#                (e.g. 3.5) marks a profile clearly between two levels
#   by_example:  optional per-example values when the rated examples differ (SaaS: Prewave, Sphera);
#                the plotted value is then their mean and the chart shows the spread
#   confidence:  H = verified from code / primary documentation, M = plausible / partly documented,
#                L = assumption / little public evidence
#   rationale:   short justification; sources are listed under approaches.<key>.evidence

meta:
  title: Supplier risk management and performance evaluation approaches profiled on 15 success factors
  model_version: "0.5"
  evidence_date: "2026-10"
  scale: {min: 1, max: 5}
  caption: >-
    Four approaches to supplier risk management and performance evaluation profiled on 15 success factors
    (model v0.5).
    Illustrative, qualitative assessment by the author based on public information and code review
    (October 2026); expert judgement, not an empirical measurement;
    rationale and confidence for every value in research/comparison-matrix.md.
    Proprietary SaaS plotted as the mean of the known values of Prewave and Sphera, with the spread marked
    where they differ. "?" marks an unknown value (no public evidence either way), which is not plotted as low.
    No weighting is applied and no total or ranking is derived.

approaches:
  - key: xls
    label: Simple Excel scorecard (manual)
    short: Excel
    rated: >-
      A simple, manually maintained spreadsheet scorecard (criteria sheet, weights, annual update). Elaborate
      spreadsheet solutions (macros, Power Query, shared data models) can do more and are not rated here.
    evidence: The author's practitioner experience; assumption-based.
  - key: saas
    label: Proprietary SaaS (Prewave, Sphera)
    short: SaaS
    rated: Prewave and Sphera Supply Chain Risk Management as examples of commercial SCRM platforms.
    evidence: >-
      Public information only (vendor websites, help centre, press releases, vendor-commissioned studies),
      see research/saas-references.md. No hands-on test.
    examples: [Prewave, Sphera]
  - key: oss
    label: Open-source GitHub repos
    short: Open repos
    rated: The five reviewed open-source blueprints.
    evidence: Source code review, see research/github-references.md and research/comparison.md.
  - key: lean
    label: Lean Agentic (this repo)
    short: Lean Agentic
    rated: This repository as implemented (v0.1.0, October 2026), not the roadmap.
    evidence: Code, tests and documentation in this repository.

factors:
  - id: 1
    key: criteria_weights
    label: Structured criteria & weights (objective + subjective)
    short_label: Criteria & weights
    v01: [1, 5]
    ratings:
      xls:
        value: 3
        confidence: M
        rationale: >-
          Scorecards with criteria and weights are common and can mix data and judgement, but definitions,
          scales and provenance are often informal and drift between versions.
      saas:
        value: 4
        by_example: {Prewave: 4, Sphera: 4}
        confidence: M
        rationale: >-
          Prewave publishes a structured score combining peer, alert, assessment and external data;
          Sphera describes indicator scorecards combining monitoring and questionnaires.
      oss:
        value: 2
        confidence: H
        rationale: >-
          Only 2 of 5 repos have deterministic weighted scoring, both with hard-coded weights; mostly one input type.
      lean:
        value: 4
        confidence: H
        rationale: >-
          Multi-dimensional criteria, 1-5 scales, weights in a validated config; expert ratings and
          indicator-derived ratings with provenance and documented overrides. Not 5: template is illustrative,
          not empirically validated; objective indicators are entered or imported from files (CSV export,
          downloaded WGI table), not fetched live.

  - id: 2
    key: traceability
    label: Explainability & traceability (per result)
    short_label: Explainability & traceability
    v01: [2, 8]
    scope: >-
      Result level: can a user see why one specific supplier got its score and class, and reproduce it?
      Inputs with source and data date, missing data, rating rules, weights, contributions, rules that are not
      additive, and a record of the result. Method documentation in general belongs to factor 3; human
      decisions and corrections belong to factor 6.
    anchors:
      1: Only a score or class is shown; no reasons per supplier.
      2: Main drivers or categories are named per supplier, but inputs and weights are not visible; the user
        cannot reproduce the result.
      3: Per supplier, the breakdown into components or criteria with their weights is visible; sources are
        partly linked; reproduction needs the vendor or manual work.
      4: Complete per-supplier trace of inputs, sources, rules and weights, a record of each result, and
        recomputation from recorded inputs.
      5: As 4, plus quantified contributions that add up to the result, separate explanation of non-additive
        rules, explicit marking of missing data and sources, and explanations that cite trace entries.
    ratings:
      xls:
        value: 3
        confidence: M
        rationale: >-
          A scorecard usually shows criterion ratings and weights per supplier row, so the breakdown is visible;
          sources and data dates are rarely recorded, and there is no per-result record beyond file copies.
      saas:
        value: 3
        by_example: {Prewave: 3, Sphera: null}
        at_least: [Prewave]
        confidence: M
        rationale: >-
          Prewave documents per supplier the 360° score split into components with fixed weights (peer 30 %,
          alerts 40 %, self-assessment 20 %, external data 10 %), a 24-month score history filterable by alert,
          and links from country risk to the underlying indices; the contribution of individual alerts and
          explanations citing data were not found publicly (unknown, not absent). Sphera describes AI summaries
          and "weighted risk scoring" at marketing level only; no per-result breakdown is documented, so the
          value is unknown rather than low.
        evidence:
          - https://help.prewave.com/en/articles/246667-target-profile-overview
          - https://help.prewave.com/en/articles/237277-how-is-the-prewave-score-generated
          - https://sphera.com/company/news/sphera-launches-supplier-360-intelligence
      oss:
        value: 2.5
        confidence: H
        rationale: >-
          Two of five repos print a per-result breakdown (one with weights, contributions and the reasons of a
          hard disqualification gate); the others return a tier or simulated text without reasons. No sources
          or data dates; 2 of 5 use LLM-judged scores.
        evidence:
          - https://github.com/poshalanavateja/Vendor-Bid-Evaluation-Ai
          - https://github.com/Bhardwaj-Saurabh/OmniSupply-AI-Multi-Agent-Supply-Chain-Intelligence-Platform
      lean:
        value: 4.5
        confidence: H
        rationale: >-
          Deterministic scoring trace per supplier and view: inputs with source and data date (missing ones
          flagged), rating rules generated from the engine's own constants, nominal and effective weights,
          contributions that add up to the score (tested for all sample suppliers), escalation rules and the
          completeness check explained separately; the optional LLM explanation must cite trace entry ids.
          Model and weight version on every result; corrections and snapshots recorded. Not 5: run records are
          local files, not a central, access-controlled store, and sources are only as good as the data entered.
        evidence:
          - src/supplier_risk_agent/tools/explain.py
          - tests/test_explain_correct.py
          - src/supplier_risk_agent/tools/ai_review.py
          - docs/images/ui-explain-correct.png

  - id: 3
    key: transparency
    label: Methodological transparency
    short_label: Method transparency
    v01: [13]
    scope: >-
      Model level, before use: are the method, formulas, weights, rules and data sources documented and
      checkable? Explaining an individual result is factor 2.
    anchors:
      1: The method is not disclosed.
      2: Components are named, without weights or rules.
      3: Components and their weights are published; rules, data handling or parts of the method stay closed.
      4: Formulas, weights, thresholds and rules are documented; some parts (e.g. data processing) are closed.
      5: The complete method (formulas, weights, thresholds, rules, data sources) is documented and testable.
    ratings:
      xls:
        value: 4
        confidence: M
        rationale: Formulas are visible to everyone, provided they are documented.
      saas:
        value: 2.5
        by_example: {Prewave: 3, Sphera: 2}
        confidence: M
        rationale: >-
          Prewave publishes its score composition and component weights, but not source weighting / NLP classification;
          for Sphera no scoring methodology was found publicly.
      oss:
        value: 3
        confidence: H
        rationale: Code is visible, but LLM-judged parts are opaque.
      lean:
        value: 5
        confidence: H
        rationale: Formulas, weights, rules and calibration maths are documented and tested.

  - id: 4
    key: calibration
    label: Expert calibration / ability to learn
    short_label: Expert calibration
    v01: [3]
    ratings:
      xls:
        value: 1
        confidence: M
        rationale: Weights are adjusted by discussion, if at all.
      saas:
        value: 2
        by_example: {Prewave: 2, Sphera: 2}
        confidence: L
        rationale: >-
          Weights are adjustable by configuration (Prewave, partly via customer success); a documented fit against the
          customer's own expert labels was not found publicly for either vendor.
      oss:
        value: 1
        confidence: H
        rationale: None of the 5 repos.
      lean:
        value: 4
        confidence: H
        rationale: >-
          Constrained least-squares calibration against expert labels with MSE and class agreement, approval step and
          versioning; cross-validated acceptance with an uncertainty threshold and fit diagnostics. Not 5:
          examined on synthetic labels only, no real expert labels or field validation.

  - id: 5
    key: actions
    label: Action framework
    short_label: Action framework
    v01: [6]
    ratings:
      xls:
        value: 2
        confidence: M
        rationale: Actions are usually free text.
      saas:
        value: 4
        by_example: {Prewave: 4, Sphera: 4}
        confidence: M
        rationale: Response playbooks, action planners and tracked closure are described on product pages.
      oss:
        value: 2
        confidence: H
        rationale: Narrative recommendations.
      lean:
        value: 3.5
        confidence: H
        rationale: >-
          Configurable action framework on three levels (risk class, elevated dimension, factor level), each
          action with owner and review cycle; filterable, exportable action plan per material group. Below the
          platforms: no tracking of actions to closure, no supplier collaboration.

  - id: 6
    key: hitl
    label: Human review & correction
    short_label: Human review & correction
    v01: [7]
    scope: >-
      What a person can do with a result: review and approve, challenge it, correct data or override a rating
      with a reason, see the effect before applying it, and find the decision in a history; roles and
      permissions. The system's own record of results is factor 2; the workflow architecture is factor 13.
    anchors:
      1: No structured review; changes happen silently in data or formulas.
      2: Data or results can be edited, but without reasons, approval or history.
      3: Defined review or approval points, or a channel to report wrong data, with recorded outcomes.
      4: Review and approval workflow with recorded decisions, plus documented corrections or overrides with a
        reason; roles or a before/after view.
      5: Corrections and overrides kept apart with a mandatory reason, before/after recomputation before
        confirmation, a channel to dispute results, a complete decision history, and roles with verified
        identities.
    ratings:
      xls:
        value: 2
        confidence: M
        rationale: Cells can be changed at any time, but without reasons, approval or a decision history.
      saas:
        value: 4
        by_example: {Prewave: 4, Sphera: 4}
        at_least: [Prewave]
        uncertain: [Sphera]
        confidence: L
        rationale: >-
          Against the anchors. Prewave reaches level 4 on documented evidence: alert reporting with reason
          categories (false data, irrelevant, duplicate, ...) is reviewed manually by Prewave with defined
          outcomes (deactivated, updated, confirmed), i.e. recorded decisions on corrections with a reason;
          suppliers can answer alerts and fill in self-assessments; incident ownership and approval workflows are
          described. Overriding a score with a reason, a before/after view and the audit history are unknown, so
          4 is a documented minimum. Sphera documents level 3 (incident management, response playbooks with
          ownership and tracked closure, assessments that feed survey results into risk profiles); the level-4
          element "corrections or overrides with a reason" was not found publicly, but nothing says it is absent.
          Sphera is therefore kept at its v0.4 value of 4 and marked uncertain instead of being lowered on missing
          evidence; a hands-on test could move it either way.
        evidence:
          - https://help.prewave.com/en/articles/423361-alert-reporting
          - https://supplier.prewave.com/en/articles/589775-register-with-prewave
          - https://sphera.com/solutions/supply-chain-risk-management/
          - https://sphera.com/risk-assessment
      oss:
        value: 2
        confidence: H
        rationale: >-
          One repo ends the run with a human-review status and reasons; its override fields exist but are never
          set (listed as a future improvement). No correction, dispute or decision history in the others.
        evidence:
          - https://github.com/poshalanavateja/Vendor-Bid-Evaluation-Ai
      lean:
        value: 4
        confidence: H
        rationale: >-
          Review pause in the graph for proposed weights and flagged suppliers (approve, override class with
          comment, defer); calibrated weights need approval by default. Explain & correct separates data
          corrections from expert overrides, requires a reason, recomputes both views and shows before/after
          before confirmation, records old and new values with reason, time, model and weight version, and marks
          an earlier AI explanation as outdated; disputes are recorded without changing scores or weights.
          Not 5: no roles or permissions, names are typed in and not verified, and review state is per session.
        evidence:
          - src/supplier_risk_agent/tools/corrections.py
          - src/supplier_risk_agent/tools/history.py
          - src/supplier_risk_agent/agents/human_review.py
          - tests/test_explain_correct.py
          - tests/test_ui.py

  - id: 7
    key: signals
    label: External signals & data coverage
    short_label: External signals & coverage
    v01: [11]
    ratings:
      xls:
        value: 1
        confidence: H
        rationale: Manual research only.
      saas:
        value: 5
        by_example: {Prewave: 5, Sphera: 5}
        confidence: M
        rationale: >-
          Core strength: continuous multi-source monitoring, many languages, Tier-N mapping (feature verified;
          volumes are vendor claims).
      oss:
        value: 2
        confidence: H
        rationale: Internal databases, retrieval, mocks.
      lean:
        value: 2.5
        confidence: M
        rationale: >-
          A provider interface is in place and reads open data and system exports (e.g. a downloaded governance
          indicator table, ERP or ESG exports), filling indicators with recorded origin and vintage. Live APIs
          are still placeholders and there is no continuous monitoring, so coverage is about half of a
          monitoring platform. The architecture allows further providers, and the agentic design leaves
          long-term upside in signal processing (e.g. an external-signal agent); that potential is not rated.

  - id: 8
    key: regulatory
    label: Regulatory evidence (due-diligence documentation)
    short_label: Regulatory evidence
    v01: []
    ratings:
      xls:
        value: 2
        confidence: M
        rationale: Documentation is possible but manual and unstructured.
      saas:
        value: 4.5
        by_example: {Prewave: 5, Sphera: 4}
        confidence: M
        rationale: >-
          Prewave: dedicated modules for several due-diligence regulations (e.g. LkSG, CSDDD, EUDR).
          Sphera: LkSG bundle documented (2023); CSDDD-specific support not found publicly.
      oss:
        value: 1
        confidence: H
        rationale: Not addressed.
      lean:
        value: 2
        confidence: H
        rationale: Audit trail and an ESG / compliance factor help, but no regulation-specific workflows or reports.

  - id: 9
    key: cost
    label: Cost / total cost of ownership
    short_label: Cost / TCO
    v01: [9]
    ratings:
      xls:
        value: 3
        confidence: M
        rationale: >-
          No additional licence, but high recurring manual effort: collecting data, consolidating sheets per
          category, keeping versions and weights consistent, rebuilding reports each cycle.
      saas:
        value: 2
        by_example: {Prewave: 2, Sphera: 2}
        confidence: M
        rationale: Pricing not public; quote-based enterprise subscriptions by supplier count and modules.
      oss:
        value: 4
        confidence: M
        rationale: >-
          Free licence (restrictions rated under customisability), but demo-grade: turning them into a usable
          scoring system needs substantial development.
      lean:
        value: 4
        confidence: M
        rationale: >-
          MIT licence, runs locally; scoring, actions and reports are automated once data is mapped. Not 5:
          ownership, data integration and maintenance still need internal effort.

  - id: 10
    key: time_to_value
    label: Time-to-value / ease of adoption
    short_label: Time-to-value
    v01: [14]
    ratings:
      xls:
        value: 3
        confidence: M
        rationale: >-
          A simple sheet starts immediately; a governed scorecard with definitions, weights and consolidation
          across categories takes weeks to build by hand.
      saas:
        value: 3
        by_example: {Prewave: 3, Sphera: 3}
        confidence: L
        rationale: >-
          Fast onboarding is claimed by vendors, but enterprise procurement and integration cycles apply;
          no public implementation timelines.
      oss:
        value: 2
        confidence: H
        rationale: Demo-grade; one repo does not run as committed.
      lean:
        value: 4
        confidence: M
        rationale: >-
          Ready template, sample data, empty CSV template and spreadsheet UI: a first portfolio assessment in
          hours. Not 5: Python installation and mapping real data take effort.

  - id: 11
    key: customisability
    label: Customisability & data sovereignty
    short_label: Customisability & data sovereignty
    v01: [4, 10]
    ratings:
      xls:
        value: 4
        confidence: M
        rationale: >-
          Fully modifiable and kept in-house; separate sheets allow material-group-specific criteria and weights.
          Not 5: logic diverges between copies and is not maintainable as shared software.
      saas:
        value: 2
        by_example: {Prewave: 2, Sphera: 2}
        confidence: M
        rationale: >-
          Configurable within the product; method and code are not independently changeable; data hosted by the
          vendor. Prewave includes commodity in its peer score and offers customised perspectives, but detailed
          per-commodity configuration is not publicly documented for either vendor. Such product configuration
          does not establish customer control of the method, implementation or data.
      oss:
        value: 3
        confidence: H
        rationale: >-
          Code visible, but 2 repos have no licence and 1 is GPL, which restricts reuse. None provides material-group
          adaptation out of the box; adding it requires code changes. Visible code alone does not give unrestricted,
          ready-to-use control of the method.
      lean:
        value: 5
        confidence: H
        rationale: >-
          MIT licence, config-driven, data and model stay in-house. Material-group weights and most-specific weight
          resolution provide a concrete, implemented case of customer-controlled adaptation; per-group fitting is
          assessed under expert calibration. No vendor is needed to modify the method or implementation.

  - id: 12
    key: scalability
    label: Scalability
    short_label: Scalability
    v01: [12]
    ratings:
      xls:
        value: 2
        confidence: M
        rationale: A simple manual scorecard becomes hard to maintain beyond a few hundred suppliers.
      saas:
        value: 5
        by_example: {Prewave: 5, Sphera: 5}
        confidence: M
        rationale: Large enterprise deployments; vendor claims of more than a million suppliers assessed (Prewave).
      oss:
        value: 2
        confidence: H
        rationale: Demonstrators.
      lean:
        value: 3
        confidence: L
        rationale: Deterministic batch scoring is cheap, but untested at scale; in-memory checkpoints; no automated feeds.

  - id: 13
    key: extensibility
    label: Agentic orchestration & extensibility
    short_label: Agentic orchestration & extensibility
    v01: [15]
    scope: >-
      Architecture: specialised agents over a shared, inspectable state, bounded loops, a review pause as a
      workflow element, extension points. What a person can do in that pause is factor 6; the explanation of
      results, including an LLM explanation, is factor 2.
    ratings:
      xls:
        value: 1
        confidence: H
        rationale: None in a simple scorecard; macros or scripts would be custom development.
      saas:
        value: 2.5
        by_example: {Prewave: 3, Sphera: 2}
        confidence: M
        rationale: >-
          Prewave: REST APIs, ERP write-back and connectors for external AI agents; Sphera: "agentic AI"
          capabilities marketed, workflow embedding stated, public API documentation not found. Neither documents
          a customer-inspectable multi-agent workflow (specialised agents over a shared state, calibration agent,
          graph-based review pause). Both closed.
      oss:
        value: 4
        confidence: H
        rationale: >-
          Agent architectures are their main asset: specialised agents over a typed shared state, graph or
          supervisor orchestration; review pauses rare, no calibration agent.
      lean:
        value: 4
        confidence: H
        rationale: >-
          LangGraph supervisor over a typed shared state with specialised agents (data collection, scoring,
          calibration, recommendation, human review as graph interrupt); documented extension points (data
          sources, data providers, rating sources, views, agents). Scoring, calibration, recommendation and routing
          are deterministic Python nodes; one optional node calls a language model to explain results (counted
          under factor 2, not here). Not 5: rule-based supervisor, no LLM-driven planning or tool use.

  - id: 14
    key: operations
    label: Operational maturity & support
    short_label: Operational maturity
    v01: []
    ratings:
      xls:
        value: 3
        confidence: M
        rationale: Office tooling is supported by IT; no model-specific operations needed.
      saas:
        value: 5
        by_example: {Prewave: 5, Sphera: 5}
        confidence: M
        rationale: Vendor support, hosting and service levels.
      oss:
        value: 1
        confidence: H
        rationale: No maintenance commitment.
      lean:
        value: 2
        confidence: H
        rationale: Tests and CI exist, but no production deployment, security hardening or support organisation.

  - id: 15
    key: dual_view
    label: Integration of risk management and performance evaluation
    short_label: Risk & performance integration
    v01: []
    ratings:
      xls:
        value: 2
        confidence: M
        rationale: >-
          Both are often kept in spreadsheets, but as separate files with their own criteria, scales and update
          cycles; no shared criteria or data base. A common pattern in the author's experience: risk on a platform,
          evaluation in Excel.
      saas:
        value: 2
        by_example: {Prewave: 2, Sphera: 2}
        confidence: L
        rationale: >-
          Risk platforms; supplier performance evaluation (delivery, quality, price, responsiveness with its own
          grades) is not documented as part of the platform in public sources. Performance data can enter as input.
      oss:
        value: 2
        confidence: H
        rationale: Single repos cover either risk assessment or vendor / bid evaluation; none combines both.
      lean:
        value: 4
        confidence: H
        rationale: >-
          Two views on one shared criteria catalogue and one data sheet: performance (A/B/C) and risk
          (low-critical), each with its own weights, classes, actions, labels and review. Not 5: no joint
          portfolio reading (performance x risk) yet; performance view not calibrated in the template.

narrative:
  reading_profiles:
    - >-
      **Simple Excel scorecard:** no licence, transparent and quick to start; recurring manual effort, weak
      audit trail, no learning, no external signals, no extensibility. Risk and performance usually live in
      separate files.
    - >-
      **Proprietary SaaS:** strongest on data coverage, scale, workflows, regulatory evidence and operational
      maturity; weaker on cost, self-determined customisation, recomputability by the user and, depending on the
      vendor, methodological transparency (Prewave publishes its score composition, Sphera does not). Both are
      risk platforms: supplier performance evaluation typically stays outside, often in Excel.
    - >-
      **Open repos:** strong architecture ideas and free, but demonstrators: scoring often absent, hard-coded or
      LLM-judged; unclear or copyleft licences; no tests.
    - >-
      **Lean Agentic:** strongest where the method itself matters (transparency, reproducibility, calibration,
      customisability including material-group weights), on agentic orchestration and on integrating risk management with
      performance evaluation; close to the platforms on actions and human review; partial on external signals
      (provider interface for open data and exports, live APIs still placeholders); weak today on regulatory
      evidence and operational maturity.
    - >-
      The profiles are **complementary rather than ranked**. A realistic target architecture combines them:
      a SaaS subscription or open data as signal source feeding a transparent, calibrated in-house model.
  known_weaknesses:
    - >-
      **Author bias.** Factors and all ratings come from a single rater, the author of the Lean Agentic
      approach, who thus rates their own work; the ratings are qualitative judgement, not measurement. Mitigations:
      factors where SaaS is stronger are included (v0.2), Lean Agentic is rated as implemented, every rating
      carries rationale and confidence. v0.3 adds a factor (risk and performance integration) on which the
      proposed approach is strong, and re-rates five factors after practitioner feedback; both are disclosed. v0.4 folds material-group adaptation into customisability to remove a subset overlap; retained ratings and confidence are unchanged. v0.5 sharpens factors 2 and 6 and adds rating anchors after the author built the Explain & correct workflow; the anchors were written by the same person who built the feature they reward, which favours the demonstrator's design. Recommended: independent re-rating by 3-5 practitioners against the published anchors, reporting the spread.
    - "**The Excel profile is a stereotype.** Real spreadsheet practices vary widely."
    - >-
      **SaaS rated on public information only.** Hands-on evaluation could move several ratings, especially
      traceability, customisability (including material-group fit), action framework, human-in-the-loop and time-to-value.
    - >-
      **No factor measures predictive validity**, i.e. whether a score anticipates real disruptions
      (see research/success-factors.md).
    - "**Date dependency.** Products change; all SaaS ratings refer to public information as of October 2026."
    - >-
      **Unknown is not absent.** Where no public evidence was found, a value is marked unknown ("?") or as a
      documented minimum ("≥"). Vendors may offer more than their public documentation shows; such values are
      the most likely to change with a hands-on test.
