name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # research and llm extras so no test is skipped for a missing package. No API key is set in CI:
        # LLM tests use mocked responses, and the real smoke test is skipped.
        run: pip install -e ".[dev,ui,research,llm]"
      - name: Lint
        run: ruff check src tests examples scripts ui
      - name: Test
        env:
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: pytest -q
      - name: CLI smoke test
        run: |
          supplier-risk --data data/sample_suppliers.json
          supplier-risk --data data/sample_suppliers.json --view performance
          supplier-risk --data data/calibration_portfolio.json --calibrate
          # without an API key the AI review shows its payload and exits cleanly, without calling a provider
          supplier-risk --data data/sample_suppliers.json --ai-review SUP-003
