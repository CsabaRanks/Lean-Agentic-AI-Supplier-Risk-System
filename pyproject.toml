[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-risk-agent"
version = "0.1.0"
description = "Transparent, configurable supplier risk evaluation as a LangGraph multi-agent workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["supplier risk", "calibration", "procurement", "supply chain", "langgraph", "multi-agent", "srm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Manufacturing",
    "Topic :: Office/Business",
]
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
research = ["matplotlib>=3.8"]  # regenerate docs/images/spider-diagram.png
ui = ["streamlit>=1.38", "pandas>=2.0"]  # spreadsheet-style front end: streamlit run ui/app.py

[project.scripts]
supplier-risk = "supplier_risk_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supplier_risk_agent = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
